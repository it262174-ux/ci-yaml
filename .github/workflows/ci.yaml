name: Yaml lab CI 
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
env:
  PROJECT: devops-shop
  TRIVY_VERSION: "0.74.0"
jobs:
  lint-check:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Lint check for the code"

      - name: Runner info
        run: |
          whoami
          pwd
          uname -a
          nproc
      

  yaml-check:
    runs-on: ubuntu-latest
    env:
      STAGE: yaml
    steps:
      - name: Check Yaml 
        run: echo " Checking yaml configuration" > result.txt

      - name: check file 
        run: ls -la  

      - name: file list
        run: cat result.txt  
        
      - name: Env test
        run: echo "$PROJECT - $STAGE" 

  build-check:
    needs: [yaml-check, lint-check, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "$PROJECT - $STAGE"
      - name: override
        env:
          APP_ENV: test
        run: echo "$APP_ENV"

      - name: Build check
        run: echo "build start"
      
      - name:
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "SHA: ${{ github.ref }}"
          echo "SHA: ${{ github.repository }}"
          echo "IMAGE: $PROJECT:${{ github.sha }}"
      - name:
        env: 
          TOKEN: ${{ secrets.DEMO_TOKEN }} 
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TOKEN is missing"
            exit 1
          fi
          echo "TOKEN is set"
  deploy-check:
    needs: [build-api,build-gateway,build-frontend,build-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
      
    steps:
      - name: Deploy
        run: echo "Deploying with ${{ github.sha }}"  

      - name: Deploy with manually
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deploy"        

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install denpendencies
        run: pip install pytest
      - name: Run test
        run: pytest    
  build-api:
    needs: build-check
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-shop-api
      CONTEXT: ./api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} $CONTEXT

      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:$TRIVY_VERSION image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            $IMAGE:${{ github.sha }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push $IMAGE:${{ github.sha }}

  build-gateway:
    needs: build-check
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-shop-gateway
      CONTEXT: ./gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} $CONTEXT

      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:$TRIVY_VERSION image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            $IMAGE:${{ github.sha }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push $IMAGE:${{ github.sha }}
  build-frontend:
    needs: build-check
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-shop-frontend
      CONTEXT: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} $CONTEXT

      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:$TRIVY_VERSION image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            $IMAGE:${{ github.sha }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push $IMAGE:${{ github.sha }}

  deploy:
    needs: [deploy-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key  
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Copy compose file
        run: |
          scp -i ~/.ssh/deploy_key \
            compose.yaml compose.prod.yaml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/devops-shop/

      - name: save crrent version
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd ~/deploy-shop && \
             docker inspect --format="{{.Config.Image}}" devops-shop-api-1 \
               | cut -d: -f2 > .previous_tag 2>/dev/null || echo "" > .previous_tag: \
             echo "Previous tag: $(cat .previous_tag)"'                
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/devops-shop && \ 
             export REGISTRY_USER=${{ secrets.DOCKERHUB_USERNAME }} && \
             export IMAGE_TAG=${{ github.sha }} && \
             docker compose -f compose.yaml -f compose.prod.yaml pull && \
             docker compose -f compose.yaml -f compose.prod.yaml up -d"
      - name: healthcheck
        id: health
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'for i in $(seq 1 15); do
              if curl -fsS http://localhost/api/ > /dev/null; then
                echo "Healthy after $i attempts"
                exit 0
              fi
              echo "attempt $i failed, retrying ..."
              sleep 2
            done
            echo "Healthy check FAILED"
            docker compose -f ~/deploy-shop/compose.yaml -f ~/deploy-shop/compose.prod.yaml ps
            exit 1'         
      - name: Rollback
        if: failure() && steps.health.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd ~/devops-shop && \
             PREV=$(cat .previous_tag) && \
             if [ -z "$PREV" ]; then echo "No previous version to roll back to"; exit 1; fi && \
             echo "Rolling back to $PREV" && \
             export REGISTRY_USER=${{ secrets.DOCKERHUB_USERNAME }} && \
             export IMAGE_TAG=$PREV && \
             docker compose -f compose.yaml -f compose.prod.yaml up -d'      