x-common-env: &common_env              # ✅ CHANGED: env ကို anchor သီးသန့်ခွဲ
  LOG_LEVEL: info
  APP_ENV: development

x-common: &common
  restart: unless-stopped
  networks:
    - shop-network

x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  secrets-check:                       # ✅ CHANGED: secrects → secrets-check (typo)
    image: alpine:3.20
    command: ["sleep", "3600"]
    profiles:
      - tools
    secrets:
      - db_password

  debug:
    image: alpine:3.20
    command: ["sleep", "3600"]
    profiles:
      - debug
    <<: *common

  gateway:                             # ✅ CHANGED: gateway service အသစ်
    build:
      context: ./gateway
    image: devops-shop-gateway:dev
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - api
    <<: *common
    logging: *default_logging

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: "2.0"             # ✅ CHANGED: quote (number မဖြစ်အောင်)
    image: devops-shop-frontend:dev    # ✅ CHANGED: workflow နာမည်နဲ့ ကိုက်
    env_file:
      - env/.frontend.env
    environment:
      <<: *common_env
    ports:
      - "8081:80"
    <<: *common
    logging: *default_logging

  api:
    build:
      context: ./api
    image: devops-shop-api:dev         # ✅ CHANGED
    configs:
      - source: app.config
        target: /app/config/app.conf
    environment:
      <<: *common_env                  # ✅ CHANGED: LOG_LEVEL / APP_ENV မပျောက်အောင်
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5001:5000"
    depends_on:
      database:
        condition: service_healthy
    <<: *common
    logging: *default_logging

  database:
    image: postgres:17
    env_file:
      - env/.database.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - postgres
      - -c
      - max_connections=200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    <<: *common
    logging: *default_logging

volumes:
  postgres_data:

networks:
  shop-network:

configs:
  app.config:
    file: ./config/app.conf

secrets:
  db_password:
    file: ./secrets/db_password.txt